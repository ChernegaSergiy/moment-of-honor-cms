name = "moment-of-honor-cms"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# KV namespace used to cache installation access tokens and the generated
# feed at the edge. Create with: wrangler kv namespace create CACHE
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (set with: wrangler secret put <NAME>)
#   GITHUB_APP_ID              - GitHub App ID
#   GITHUB_APP_PRIVATE_KEY     - GitHub App private key (PEM)
#   GITHUB_APP_CLIENT_ID       - GitHub App OAuth client ID
#   GITHUB_APP_CLIENT_SECRET   - GitHub App OAuth client secret
#   GITHUB_WEBHOOK_SECRET      - GitHub App webhook secret
#   SESSION_SECRET             - Secret used to sign author session cookies

[vars]
CONTENT_REPO_OWNER = "REPLACE_WITH_ORG_OR_USER"
CONTENT_REPO_NAME = "moment-of-honor-content"
CONTENT_REPO_BRANCH = "main"
